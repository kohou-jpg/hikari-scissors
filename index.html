    const products = allData.map((p, idx) => {
        let sKey = "STANDARD";
        for(let key in seriesLibrary) {
            if(p.series.toLowerCase().includes(key.toLowerCase())) { sKey = key; break; }
        }

    let curLang = 'zh';

    function setLang(lang) {
        curLang = lang;
        document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));

        document.getElementById('ui-title').innerText = i18n[lang].title;
        document.getElementById('f-search').innerText = i18n[lang].f_search;
        document.getElementById('search-input').placeholder = i18n[lang].search_placeholder;
        document.getElementById('f-sort').innerText = i18n[lang].f_sort;
        document.getElementById('f-type').innerText = i18n[lang].f_type;
        document.getElementById('f-size').innerText = i18n[lang].f_size;
        
        document.getElementById('f-rate').innerText = i18n[lang].f_rate;
        document.getElementById('label-rate-40').innerText = i18n[lang].rate_40;
        document.getElementById('mobile-filter-btn').innerText = i18n[lang].toggle_btn;
        
        const s = document.getElementById('sort-order');
        s.options[0].text = i18n[lang].def_sort;
        s.options[1].text = i18n[lang].p_low;
        s.options[2].text = i18n[lang].p_high;

        document.getElementById('label-blunt').innerText = i18n[lang].blunt;
        document.getElementById('label-thin').innerText = i18n[lang].thin;
        document.getElementById('label-slide').innerText = i18n[lang].slide;
        document.getElementById('label-lefty').innerText = i18n[lang].lefty;
        
        updateFilters();
    }

    // 移动端折叠控制
    function toggleMobileFilter() {
        document.getElementById('filter-content').classList.toggle('active');
    }

    // 悬浮返回顶部控制
    window.onscroll = function() {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            document.getElementById("back-to-top").style.display = "block";
        } else {
            document.getElementById("back-to-top").style.display = "none";
        }
    };
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateFilters() {
        const selCats = Array.from(document.querySelectorAll('.f-cat:checked')).map(i => i.value);
        const selSizes = Array.from(document.querySelectorAll('.f-size:checked')).map(i => parseInt(i.value));
        const selRates = Array.from(document.querySelectorAll('.f-rate:checked')).map(i => i.value);
        const sortVal = document.getElementById('sort-order').value;
        const searchText = document.getElementById('search-input').value.toLowerCase();

        let filtered = products.filter(p => {
            const catMatch = selCats.length === 0 || selCats.includes(p.cat);
            const sizeMatch = selSizes.length === 0 || selSizes.some(s => p.size >= s && p.size < (s + 1));
            const searchMatch = p.model.toLowerCase().includes(searchText) || p.series.toLowerCase().includes(searchText);
            
            let rateMatch = true;
            if (selRates.length > 0) {
                if (p.cat.includes('牙剪')) {
                    rateMatch = selRates.some(r => {
                        const [min, max] = r.split('-').map(Number);
                        return p.rate >= min && p.rate < max;
                    });
                } else {
                    rateMatch = false; 
                }
            }

            return catMatch && sizeMatch && searchMatch && rateMatch;
        });

        if (sortVal === 'price-asc') filtered.sort((a, b) => a.specialPrice - b.specialPrice);
        else if (sortVal === 'price-desc') filtered.sort((a, b) => b.specialPrice - a.specialPrice);
        else filtered.sort((a, b) => a.id - b.id);

        document.getElementById('result-count').innerText = i18n[curLang].count.replace('{n}', filtered.length);
        render(filtered);
    }

    function render(data) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            const rateBadge = (p.cat.includes('牙剪') && p.rate > 0) ? `<span class="badge badge-red">Rate: ${p.rateLabel}</span>` : '';
            const catKey = p.cat === '平剪' ? 'blunt' : p.cat === '牙剪' ? 'thin' : p.cat === '滑剪' ? 'slide' : 'lefty';
            
            card.innerHTML = `
                <div class="card-img">
                    <div class="discount-badge">${i18n[curLang].discount}</div>
                    <img src="images/${p.model}.jpg" loading="lazy" onerror="this.src='https://placehold.co/400x300?text=${p.model}'" alt="${p.model}">
                </div>
                <div class="card-body">
                    <div class="series-tag">${p.series}</div>
                    <h3 class="model-name">${p.model}</h3>
                    <div class="tag-row"><span class="badge">${i18n[curLang][catKey].split(' ')[0]}</span>${rateBadge}</div>
                    <div class="desc-text">${p.desc[curLang]}</div>
                    <div class="spec-item"><span>${i18n[curLang].mat}</span><strong>${p.mat[curLang]}</strong></div>
                    <div class="spec-item"><span>${i18n[curLang].size}</span><strong>${p.size}"</strong></div>
                    
                    <div class="price-container">
                        <div class="original-price">¥ ${p.price.toLocaleString()}</div>
                        <span class="special-label">${i18n[curLang].special_label}</span>
                        <div class="price-val-special">¥ ${p.specialPrice.toLocaleString()}</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('change', updateFilters));
    setLang('zh');
